# =============================================================================
# GDMAS DOCKER COMPOSE DEVELOPMENT OVERRIDE
# Tự động nạp khi chạy `docker compose up` hoặc `docker compose up -d`
# Hỗ trợ Hot-Reload tức thì: Sửa code trên máy host là Container tự cập nhật!
# =============================================================================

services:
  api:
    volumes:
      - ./apps/api/src/gdmas:/app/src/gdmas:ro
    command: uvicorn gdmas.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src/gdmas
    environment:
      DEBUG: "True"
      ENVIRONMENT: "development"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
      - ./apps/web/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    command: pnpm dev --host 0.0.0.0 --port 3000
    environment:
      NODE_ENV: "development"
      VITE_API_BASE_URL: "http://localhost:8000"

  ingestion:
    volumes:
      - ./apps/api/src/gdmas:/app/src/gdmas:ro

  analysis:
    volumes:
      - ./apps/api/src/gdmas:/app/src/gdmas:ro

  clustering:
    volumes:
      - ./apps/api/src/gdmas:/app/src/gdmas:ro

  prediction:
    volumes:
      - ./apps/api/src/gdmas:/app/src/gdmas:ro
