services:
  postgres:
    image: postgres:16-alpine
    container_name: gdmas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gdmas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gdmas_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-gdmas_db}
      TZ: UTC
    volumes:
      - gdmas_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gdmas_user} -d ${POSTGRES_DB:-gdmas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gdmas-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gdmas-api
    restart: unless-stopped
    command: uvicorn gdmas.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src/gdmas
    volumes:
      - ./apps/api/src/gdmas:/app/src/gdmas:ro
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gdmas_user}:${POSTGRES_PASSWORD:-gdmas_secure_password_2026}@postgres:5432/${POSTGRES_DB:-gdmas_db}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gdmas-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: gdmas-web
    restart: unless-stopped
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
      - ./apps/web/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    command: pnpm dev --host 0.0.0.0 --port 3000
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - gdmas-net

  ingestion:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gdmas-worker-ingestion
    restart: unless-stopped
    command: python -m gdmas.services.ingestion.runner
    volumes:
      - ./apps/api/src/gdmas:/app/src/gdmas:ro
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gdmas_user}:${POSTGRES_PASSWORD:-gdmas_secure_password_2026}@postgres:5432/${POSTGRES_DB:-gdmas_db}
      USGS_FEED_URL: ${USGS_FEED_URL}
      INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gdmas-net

  analysis:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gdmas-worker-analysis
    restart: unless-stopped
    command: python -m gdmas.services.analysis.runner
    volumes:
      - ./apps/api/src/gdmas:/app/src/gdmas:ro
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gdmas_user}:${POSTGRES_PASSWORD:-gdmas_secure_password_2026}@postgres:5432/${POSTGRES_DB:-gdmas_db}
      ANALYSIS_INTERVAL_SECONDS: ${ANALYSIS_INTERVAL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gdmas-net

  prediction:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gdmas-worker-prediction
    restart: unless-stopped
    command: python -m gdmas.services.prediction.runner
    volumes:
      - ./apps/api/src/gdmas:/app/src/gdmas:ro
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gdmas_user}:${POSTGRES_PASSWORD:-gdmas_secure_password_2026}@postgres:5432/${POSTGRES_DB:-gdmas_db}
      PREDICTION_INTERVAL_SECONDS: ${PREDICTION_INTERVAL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gdmas-net

  clustering:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gdmas-worker-clustering
    restart: unless-stopped
    command: python -m gdmas.services.clustering.runner
    volumes:
      - ./apps/api/src/gdmas:/app/src/gdmas:ro
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gdmas_user}:${POSTGRES_PASSWORD:-gdmas_secure_password_2026}@postgres:5432/${POSTGRES_DB:-gdmas_db}
      CLUSTERING_INTERVAL_SECONDS: ${CLUSTERING_INTERVAL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gdmas-net

volumes:
  gdmas_pgdata:
    name: gdmas_pgdata

networks:
  gdmas-net:
    driver: bridge
